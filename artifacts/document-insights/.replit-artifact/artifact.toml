kind = "web"
previewPath = "/"
title = "Document Insights"
description = "An intelligent document and data analysis agent that lets people upload files, ask natural-language questions, and receive grounded summaries, findings, and next steps."
version = "1.0.0"
id = "artifacts/document-insights"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21883

[services.development]
run = "pnpm --filter @workspace/document-insights run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/document-insights", "run", "build" ]
serve = "static"
publicDir = "artifacts/document-insights/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21883"
BASE_PATH = "/"
